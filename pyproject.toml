[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sta4020-group-project"
version = "0.1.0"
description = "STA4020 final project: return model, risk model, portfolio construction and OOS evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
sta4020-check-data = "sta4020_project.pipeline.checks:check_data"
sta4020-check-artifacts = "sta4020_project.pipeline.checks:check_artifacts"
sta4020-sample = "sta4020_project.pipeline.sample:main"
sta4020-build-returns = "sta4020_project.part1.forecasts:main"
sta4020-build-risk = "sta4020_project.part2.risk:main"
sta4020-evaluate = "sta4020_project.part4.cli:main"
sta4020-run-final = "sta4020_project.pipeline.final:main"

[project.optional-dependencies]
risk = [
    "sta4020-risk-model",
]
final = [
    "h5py>=3.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
sta4020-risk-model = { path = "part2_risk_model", editable = true }
