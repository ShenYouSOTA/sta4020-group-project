[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sta4020-risk-model"
version = "0.1.0"
description = "Barra-style equity risk model based on CUHK-Shenzhen STA4020"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]
